<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wello Chat - GSM Juswell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100" x-data="welloApp">

    <template x-if="!isLoggedIn">
        <div class="h-screen w-full flex flex-col items-center justify-center p-6 bg-white">
            <img src="assets/logo.png" class="h-24 mb-6">
            <h1 class="text-4xl font-black text-[#004aad] italic tracking-tighter">WELLO CHAT</h1>
            <p class="text-[10px] font-bold text-orange-500 uppercase tracking-[0.3em] mb-12">Directeur & Collaborateurs</p>
            
            <div class="w-full max-w-sm space-y-4">
                <input type="tel" x-model="phoneInput" placeholder="NUMÉRO DE TÉLÉPHONE" class="w-full p-6 bg-gray-50 rounded-[2rem] text-center font-bold text-gray-400 outline-none border border-transparent focus:border-blue-100">
                <input type="password" x-model="passInput" placeholder="CODE SECRET" class="w-full p-6 bg-gray-50 rounded-[2rem] text-center font-bold text-gray-400 outline-none border border-transparent focus:border-blue-100">
                <button @click="login()" class="w-full py-6 bg-[#004aad] text-white rounded-[2rem] font-black uppercase tracking-widest shadow-xl shadow-blue-100 active:scale-95 transition">Se connecter</button>
            </div>
            <p class="mt-20 text-[10px] font-bold text-gray-300 uppercase tracking-widest">© 2026 GSM JUSWELL SERVICE</p>
        </div>
    </template>

    <template x-if="isLoggedIn">
        <div class="max-w-md mx-auto min-h-screen bg-white flex flex-col relative">
            <header class="p-6 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-black text-[#004aad] italic">Wello Chat</h2>
                    <p class="text-[9px] font-black text-orange-500 uppercase tracking-widest" x-text="isAdmin ? 'ESPACE DIRECTION' : 'ESPACE COLLABORATEUR'"></p>
                </div>
                <div class="flex gap-2">
                    <button class="p-3 bg-gray-50 rounded-full text-gray-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></button>
                    <button @click="logout()" class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center"><div class="w-2 h-2 bg-blue-600 rounded-full"></div></button>
                </div>
            </header>

            <nav class="px-6 py-2 flex gap-2">
                <button @click="tab = 'chats'" :class="tab === 'chats' ? 'bg-[#004aad] text-white' : 'bg-gray-100 text-gray-400'" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest transition">Chats</button>
                <button @click="tab = 'clients'" :class="tab === 'clients' ? 'bg-[#004aad] text-white' : 'bg-gray-100 text-gray-400'" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest transition">Clients</button>
                <button @click="tab = 'admin'" :class="tab === 'admin' ? 'bg-[#004aad] text-white' : 'bg-gray-100 text-gray-400'" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest transition">Admin</button>
            </nav>

            <main class="flex-1 p-6">
                <div x-show="tab === 'chats'" class="space-y-4">
                    <template x-for="group in groups" :key="group.id">
                        <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-3xl">
                            <div class="w-12 h-12 bg-[#004aad] rounded-2xl flex items-center justify-center text-white font-black" x-text="group.name[0]"></div>
                            <div class="flex-1">
                                <h3 class="font-bold text-sm" x-text="group.name"></h3>
                                <p class="text-[10px] text-gray-400 font-bold uppercase" x-text="group.lastMessage"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </main>

            <template x-if="isAdmin">
                <button @click="showModal = true" class="fixed bottom-10 right-10 w-16 h-16 bg-[#004aad] text-white rounded-3xl shadow-2xl shadow-blue-200 flex items-center justify-center active:scale-90 transition">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                </button>
            </template>
        </div>
    </template>

</body>
</html>
