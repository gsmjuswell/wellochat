<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wello Chat by GSM Juswell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

    <script>
      const firebaseConfig = {
  apiKey: "AIzaSyC_Yhua_kHtW1iHVdPsdC0-p8dROmQx1hE",
  authDomain: "wello-chat.firebaseapp.com",
  projectId: "wello-chat",
  storageBucket: "wello-chat.firebasestorage.app",
  messagingSenderId: "823717850732",
  appId: "1:823717850732:web:fff5401d7dbcdeb90cf249"
};
        firebase.initializeApp(firebaseConfig);
        const db      = firebase.firestore();
        const storage = firebase.storage();
    </script>

    <script>
        // ══════════════════════════════════════════════════
        //  UTILITAIRES
        // ══════════════════════════════════════════════════
        function generateToken(n) {
            n = n||64;
            var c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789",r="";
            for(var i=0;i<n;i++) r+=c[Math.floor(Math.random()*c.length)];
            return r;
        }
        function fmtTime(ts) {
            if(!ts) return '';
            var d=ts.toDate?ts.toDate():new Date(ts);
            return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
        }
        // Génère les initiales : "Justin TSOGBE" → "JT" ; "Directeur Général" → "DG"
        function initiales(name) {
            if(!name) return '?';
            var parts = name.trim().split(/\s+/);
            if(parts.length===1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0)+parts[parts.length-1].charAt(0)).toUpperCase();
        }
        function humanSize(bytes) {
            if(bytes<1024) return bytes+'o';
            if(bytes<1048576) return (bytes/1024).toFixed(1)+'Ko';
            return (bytes/1048576).toFixed(1)+'Mo';
        }

        // ══════════════════════════════════════════════════
        //  welloApp — défini AVANT Alpine (defer)
        // ══════════════════════════════════════════════════
        function welloApp() { return {
            // ── Auth ──
            isLoggedIn:false, isAdmin:false,
            loginLoading:false, loginError:'',
            phoneInput:'', passInput:'',
            dgPhone:'92239333', dgCode:'Juswell',

            // ── UI ──
            tab:'chats', showSearch:false, searchQuery:'', menuOpen:false,

            // ── Chat ──
            activeChat:null, messages:[], newMessage:'',
            unsubMessages:null, uploadProgress:0,

            // ── Modales ──
            showGroupModal:false, showManageMembers:false,
            showInviteModal:false, showDeleteGroup:false,
            groupToDelete:null,

            // ── Appels WebRTC ──
            callState:null,   // null | 'outgoing' | 'incoming' | 'active'
            callType:null,    // 'audio' | 'video'
            callTarget:null,
            localStream:null, remoteStream:null,
            peerConn:null,
            localVideoEl:null, remoteVideoEl:null,
            unsubCall:null,

            // ── Invitation ──
            inviteNom:'', invitePrenom:'', invitePhone:'',
            inviteRole:'client', inviteGroupId:'',
            generatedLink:'', inviteLoading:false, inviteStep:1,

            // ── Groupe ──
            newGroupName:'', selectedMembers:[],

            // ── Données ──
            userProfile:{name:'',role:''},
            usersList:[], groupsList:[],

            // ── Getters ──
            get filteredUsers(){
                var q=this.searchQuery.toLowerCase();
                return q ? this.usersList.filter(u=>u.name.toLowerCase().includes(q)) : this.usersList;
            },
            get filteredGroups(){
                var self=this;
                return this.isAdmin ? this.groupsList
                    : this.groupsList.filter(g=>Array.isArray(g.members)&&g.members.includes(self.phoneInput));
            },

            // ── Init ──
            init(){
                var self=this;
                this.$watch('activeChat',function(chat){
                    if(self.unsubMessages){self.unsubMessages();self.unsubMessages=null;}
                    self.messages=[];
                    if(chat) self.listenMessages();
                });
                var token=new URLSearchParams(window.location.search).get('invite');
                if(token) this.handleInviteToken(token);
            },

            initiales(name){ return initiales(name); },

            // ══════════════════════════════════════════════
            //  AUTH
            // ══════════════════════════════════════════════
            async login(){
                if(!this.phoneInput.trim()) return;
                this.loginError=''; this.loginLoading=true;
                try {
                    if(this.phoneInput===this.dgPhone){
                        if(this.passInput!==this.dgCode){this.loginError='Code DG incorrect.';return;}
                        this.isAdmin=true; this.isLoggedIn=true;
                        this.userProfile={name:'Directeur Général',role:'Administrateur'};
                        await this.loadAllUsers(); await this.loadGroups();
                    } else {
                        var snap=await db.collection('users').where('phone_number','==',this.phoneInput).get();
                        if(snap.empty){this.loginError='Numéro non reconnu.';return;}
                        var data=snap.docs[0].data();
                        this.isAdmin=false; this.isLoggedIn=true;
                        this.userProfile={name:data.name,role:data.role};
                        this.usersList=[{id:'dg',name:'Directeur Général (GSM)',phone:this.dgPhone,last_message:'Support disponible'}];
                        await this.loadGroups();
                    }
                } catch(e){console.error(e);this.loginError='Erreur. Réessayez.';}
                finally{this.loginLoading=false;}
            },

            logout(){
                if(this.unsubMessages) this.unsubMessages();
                if(this.unsubCall) this.unsubCall();
                this.hangUp();
                Object.assign(this,{isLoggedIn:false,isAdmin:false,phoneInput:'',passInput:'',
                    usersList:[],groupsList:[],activeChat:null,messages:[],
                    userProfile:{name:'',role:''}});
            },

            // ══════════════════════════════════════════════
            //  DATA
            // ══════════════════════════════════════════════
            async loadAllUsers(){
                try{
                    var snap=await db.collection('users').where('phone_number','!=',this.dgPhone).get();
                    this.usersList=snap.docs.map(d=>Object.assign({id:d.id,phone:d.data().phone_number},d.data()));
                }catch(e){console.error(e);}
            },
            async loadGroups(){
                try{
                    var snap=await db.collection('groups').get();
                    this.groupsList=snap.docs.map(d=>Object.assign({id:d.id,members:[]},d.data()));
                }catch(e){console.error(e);}
            },

            // ══════════════════════════════════════════════
            //  GROUPES — créer / supprimer
            // ══════════════════════════════════════════════
            async createGroup(){
                if(!this.newGroupName.trim()) return alert('Nom requis');
                try{
                    var ref=await db.collection('groups').add({
                        name:this.newGroupName.trim(), members:this.selectedMembers,
                        created_by:this.dgPhone,
                        created_at:firebase.firestore.FieldValue.serverTimestamp()
                    });
                    this.groupsList.push({id:ref.id,name:this.newGroupName.trim(),members:this.selectedMembers.slice()});
                    this.newGroupName=''; this.selectedMembers=[]; this.showGroupModal=false;
                }catch(e){console.error(e);alert('Erreur création.');}
            },

            confirmDeleteGroup(group,e){
                e.stopPropagation();
                this.groupToDelete=group; this.showDeleteGroup=true;
            },
            async deleteGroup(){
                if(!this.groupToDelete) return;
                try{
                    await db.collection('groups').doc(this.groupToDelete.id).delete();
                    this.groupsList=this.groupsList.filter(g=>g.id!==this.groupToDelete.id);
                    if(this.activeChat && this.activeChat.id===this.groupToDelete.id) this.activeChat=null;
                    this.showDeleteGroup=false; this.groupToDelete=null;
                }catch(e){console.error(e);alert('Erreur suppression.');}
            },

            async updateGroupMembers(){
                if(!this.activeChat||!this.activeChat.id) return;
                try{
                    await db.collection('groups').doc(this.activeChat.id).update({members:this.activeChat.members});
                    this.showManageMembers=false;
                    await this.loadGroups();
                }catch(e){console.error(e);}
            },

            // ══════════════════════════════════════════════
            //  INVITATION
            // ══════════════════════════════════════════════
            async generateLink(){
                if(!this.invitePhone.trim()) return alert('Numéro requis.');
                if(!this.inviteNom.trim())   return alert('Nom requis.');
                if(!this.invitePrenom.trim()) return alert('Prénom requis.');
                this.inviteLoading=true;
                try{
                    var fullName=this.invitePrenom.trim()+' '+this.inviteNom.trim();
                    var phone=this.invitePhone.trim();
                    var existing=await db.collection('users').where('phone_number','==',phone).get();
                    if(existing.empty){
                        await db.collection('users').add({
                            name:fullName, phone_number:phone, role:this.inviteRole,
                            poste:'', societe:'',
                            projet_contrat:this.inviteGroupId?(this.groupsList.find(g=>g.id===this.inviteGroupId)||{}).name||'':'',
                            created_at:firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    if(this.inviteGroupId){
                        var gRef=db.collection('groups').doc(this.inviteGroupId);
                        var gSnap=await gRef.get();
                        if(gSnap.exists){
                            var mbs=gSnap.data().members||[];
                            if(!mbs.includes(phone)){mbs.push(phone);await gRef.update({members:mbs});}
                        }
                    }
                    var token=generateToken(64);
                    await db.collection('invitations').doc(token).set({
                        phone_number:phone, nom:this.inviteNom.trim(), prenom:this.invitePrenom.trim(),
                        role:this.inviteRole, group_id:this.inviteGroupId||'',
                        token:token, used:false, created_at:firebase.firestore.FieldValue.serverTimestamp()
                    });
                    this.generatedLink=window.location.origin+window.location.pathname+'?invite='+token;
                    this.inviteStep=2;
                    await this.loadAllUsers();
                }catch(e){console.error(e);alert('Erreur: '+e.message);}
                finally{this.inviteLoading=false;}
            },
            resetInviteModal(){
                this.inviteNom='';this.invitePrenom='';this.invitePhone='';
                this.inviteRole='client';this.inviteGroupId='';
                this.generatedLink='';this.inviteStep=1;this.showInviteModal=false;
            },
            async handleInviteToken(token){
                try{
                    var d=await db.collection('invitations').doc(token).get();
                    if(!d.exists) return;
                    this.phoneInput=d.data().phone_number;
                    window.history.replaceState({},document.title,window.location.pathname);
                }catch(e){console.error(e);}
            },

            // ══════════════════════════════════════════════
            //  MESSAGES — texte
            // ══════════════════════════════════════════════
            async sendMessage(){
                var text=this.newMessage.trim();
                if(!text||!this.activeChat) return;
                try{
                    await db.collection('messages').doc(this.getConvId()).collection('msgs').add({
                        type:'text', text:text,
                        senderId:this.phoneInput, senderName:this.userProfile.name,
                        timestamp:firebase.firestore.FieldValue.serverTimestamp()
                    });
                    this.newMessage='';
                }catch(e){console.error(e);}
            },

            // ══════════════════════════════════════════════
            //  MESSAGES — vocal (enregistrement micro)
            // ══════════════════════════════════════════════
            mediaRec:null, recChunks:[], isRecording:false,

            async startVoice(){
                try{
                    var stream=await navigator.mediaDevices.getUserMedia({audio:true});
                    this.recChunks=[];
                    this.mediaRec=new MediaRecorder(stream);
                    this.mediaRec.ondataavailable=e=>this.recChunks.push(e.data);
                    this.mediaRec.onstop=()=>this.uploadVoice(stream);
                    this.mediaRec.start();
                    this.isRecording=true;
                }catch(e){alert('Micro non autorisé.');}
            },
            stopVoice(){
                if(this.mediaRec&&this.isRecording){this.mediaRec.stop();this.isRecording=false;}
            },
            async uploadVoice(stream){
                stream.getTracks().forEach(t=>t.stop());
                var blob=new Blob(this.recChunks,{type:'audio/webm'});
                var path='media/'+this.getConvId()+'/voice_'+Date.now()+'.webm';
                var ref=storage.ref(path);
                await ref.put(blob);
                var url=await ref.getDownloadURL();
                await db.collection('messages').doc(this.getConvId()).collection('msgs').add({
                    type:'voice', url:url, duration:0,
                    senderId:this.phoneInput, senderName:this.userProfile.name,
                    timestamp:firebase.firestore.FieldValue.serverTimestamp()
                });
            },

            // ══════════════════════════════════════════════
            //  MESSAGES — fichiers (photo, vidéo, doc)
            // ══════════════════════════════════════════════
            triggerFile(accept){
                var inp=document.createElement('input');
                inp.type='file'; inp.accept=accept||'*/*'; inp.multiple=false;
                inp.onchange=e=>this.uploadFile(e.target.files[0]);
                inp.click();
            },
            async uploadFile(file){
                if(!file) return;
                this.uploadProgress=1;
                try{
                    var ext=file.name.split('.').pop();
                    var path='media/'+this.getConvId()+'/'+Date.now()+'.'+ext;
                    var ref=storage.ref(path);
                    var task=ref.put(file);
                    task.on('state_changed',snap=>{
                        this.uploadProgress=Math.round(snap.bytesTransferred/snap.totalBytes*100);
                    });
                    await task;
                    var url=await ref.getDownloadURL();
                    var mtype='file';
                    if(file.type.startsWith('image/')) mtype='image';
                    else if(file.type.startsWith('video/')) mtype='video';
                    else if(file.type.startsWith('audio/')) mtype='audio';
                    await db.collection('messages').doc(this.getConvId()).collection('msgs').add({
                        type:mtype, url:url, fileName:file.name, fileSize:file.size,
                        senderId:this.phoneInput, senderName:this.userProfile.name,
                        timestamp:firebase.firestore.FieldValue.serverTimestamp()
                    });
                }catch(e){console.error(e);alert('Erreur upload.');}
                finally{this.uploadProgress=0;}
            },

            // ══════════════════════════════════════════════
            //  MESSAGES — listener temps réel
            // ══════════════════════════════════════════════
            listenMessages(){
                var self=this;
                this.unsubMessages=db.collection('messages').doc(this.getConvId())
                    .collection('msgs').orderBy('timestamp','asc')
                    .onSnapshot(snap=>{
                        self.messages=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
                        self.$nextTick(()=>{var el=document.getElementById('msgs');if(el)el.scrollTop=el.scrollHeight;});
                    });
            },
            getConvId(){
                if(this.activeChat.members!==undefined) return 'group_'+this.activeChat.id;
                return [this.phoneInput,this.activeChat.phone||this.activeChat.id].sort().join('_');
            },

            // ══════════════════════════════════════════════
            //  APPELS WEBRTC (audio + vidéo)
            //  Signaling via Firestore collection "calls"
            // ══════════════════════════════════════════════
            iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}],

            async startCall(type){
                this.callType=type; this.callTarget=this.activeChat;
                this.callState='outgoing';
                var isGroup=(this.activeChat.members!==undefined);
                var callId=this.getConvId()+'_call_'+Date.now();
                var self=this;
                try{
                    var constraints={audio:true,video:type==='video'};
                    this.localStream=await navigator.mediaDevices.getUserMedia(constraints);
                    this.$nextTick(()=>{
                        var lv=document.getElementById('local-video');
                        if(lv&&type==='video'){lv.srcObject=self.localStream;lv.play().catch(()=>{});}
                    });
                    var pc=new RTCPeerConnection({iceServers:this.iceServers});
                    this.peerConn=pc;
                    this.localStream.getTracks().forEach(t=>pc.addTrack(t,self.localStream));
                    pc.ontrack=e=>{
                        self.remoteStream=e.streams[0];
                        self.$nextTick(()=>{
                            var rv=document.getElementById('remote-video');
                            if(rv){rv.srcObject=self.remoteStream;rv.play().catch(()=>{});}
                        });
                    };
                    var callRef=db.collection('calls').doc(callId);
                    pc.onicecandidate=async e=>{
                        if(e.candidate) await callRef.collection('offerCandidates').add(e.candidate.toJSON());
                    };
                    var offer=await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    await callRef.set({
                        type:type, callerId:this.phoneInput,
                        callerName:this.userProfile.name,
                        targetId:isGroup?this.activeChat.id:(this.activeChat.phone||this.activeChat.id),
                        isGroup:isGroup,
                        members:isGroup?(this.activeChat.members||[]):[],
                        status:'ringing',
                        offer:{type:offer.type,sdp:offer.sdp},
                        created_at:firebase.firestore.FieldValue.serverTimestamp()
                    });
                    this.unsubCall=callRef.onSnapshot(async snap=>{
                        var data=snap.data();
                        if(!data) return;
                        if(data.status==='answered'&&data.answer&&pc.signalingState!=='stable'){
                            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                            self.callState='active';
                        }
                        if(data.status==='ended'||data.status==='rejected') self.hangUp();
                    });
                    callRef.collection('answerCandidates').onSnapshot(snap=>{
                        snap.docChanges().forEach(ch=>{
                            if(ch.type==='added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(()=>{});
                        });
                    });
                }catch(e){console.error(e);alert('Impossible de démarrer l\'appel.');this.hangUp();}
            },

            // Écoute les appels entrants (à appeler après login)
            listenIncomingCalls(){
                var self=this;
                db.collection('calls')
                    .where('status','==','ringing')
                    .onSnapshot(snap=>{
                        snap.docChanges().forEach(ch=>{
                            if(ch.type!=='added') return;
                            var data=ch.doc.data();
                            var isForMe=data.isGroup
                                ?Array.isArray(data.members)&&data.members.includes(self.phoneInput)
                                :data.targetId===self.phoneInput;
                            if(isForMe&&data.callerId!==self.phoneInput){
                                self.callState='incoming';
                                self.callType=data.type;
                                self.callTarget={id:ch.doc.id,...data};
                            }
                        });
                    });
            },

            async answerCall(){
                var callRef=db.collection('calls').doc(this.callTarget.id);
                var callData=(await callRef.get()).data();
                var self=this;
                try{
                    this.localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:this.callType==='video'});
                    this.$nextTick(()=>{
                        var lv=document.getElementById('local-video');
                        if(lv&&self.callType==='video'){lv.srcObject=self.localStream;lv.play().catch(()=>{});}
                    });
                    var pc=new RTCPeerConnection({iceServers:this.iceServers});
                    this.peerConn=pc;
                    this.localStream.getTracks().forEach(t=>pc.addTrack(t,self.localStream));
                    pc.ontrack=e=>{
                        self.remoteStream=e.streams[0];
                        self.$nextTick(()=>{
                            var rv=document.getElementById('remote-video');
                            if(rv){rv.srcObject=self.remoteStream;rv.play().catch(()=>{});}
                        });
                    };
                    pc.onicecandidate=async e=>{
                        if(e.candidate) await callRef.collection('answerCandidates').add(e.candidate.toJSON());
                    };
                    await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
                    callRef.collection('offerCandidates').onSnapshot(snap=>{
                        snap.docChanges().forEach(ch=>{
                            if(ch.type==='added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(()=>{});
                        });
                    });
                    var answer=await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await callRef.update({status:'answered',answer:{type:answer.type,sdp:answer.sdp}});
                    this.callState='active';
                }catch(e){console.error(e);this.hangUp();}
            },

            async hangUp(){
                if(this.peerConn){this.peerConn.close();this.peerConn=null;}
                if(this.localStream){this.localStream.getTracks().forEach(t=>t.stop());this.localStream=null;}
                this.remoteStream=null;
                if(this.unsubCall){this.unsubCall();this.unsubCall=null;}
                if(this.callTarget&&this.callTarget.id){
                    try{await db.collection('calls').doc(this.callTarget.id).update({status:'ended'});}catch(e){}
                }
                this.callState=null; this.callType=null; this.callTarget=null;
            },

            async rejectCall(){
                if(this.callTarget&&this.callTarget.id){
                    try{await db.collection('calls').doc(this.callTarget.id).update({status:'rejected'});}catch(e){}
                }
                this.callState=null; this.callType=null; this.callTarget=null;
            },

            // ══════════════════════════════════════════════
            //  DIVERS
            // ══════════════════════════════════════════════
            async copyLink(){
                try{await navigator.clipboard.writeText(this.generatedLink);alert('Lien copié !');}
                catch(e){var el=document.getElementById('gen-link');if(el){el.select();document.execCommand('copy');}}
            },
            formatTime(ts){return fmtTime(ts);},
            humanSize(b){return humanSize(b);}
        };}
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 antialiased" x-data="welloApp()" x-init="init()">

<!-- ═══════════ 1. CONNEXION ═══════════ -->
<template x-if="!isLoggedIn">
<div class="h-screen w-full flex items-center justify-center p-6 bg-juswell">
    <div class="bg-white w-full max-w-md rounded-[40px] p-10 shadow-2xl text-center">
        <img src="Logo_Wello_Chat_2.png" class="h-14 mx-auto mb-6" alt="Wello Chat">
        <h2 class="text-3xl font-black text-[#004aad] mb-2 uppercase tracking-tighter">Wello Chat</h2>
        <p class="text-gray-400 text-sm mb-8 font-medium">Authentification GSM Juswell</p>
        <div class="space-y-4">
            <input type="tel" x-model="phoneInput" @keyup.enter="login()" placeholder="Numéro de téléphone"
                   class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl font-bold text-center outline-none focus:ring-2 focus:ring-orange-500 transition">
            <div x-show="phoneInput === dgPhone">
                <input type="password" x-model="passInput" @keyup.enter="login()" placeholder="Code secret DG"
                       class="w-full p-4 bg-orange-50 border-2 border-orange-200 rounded-2xl font-bold text-center outline-none mb-4">
            </div>
            <p x-show="loginError" x-text="loginError" class="text-red-500 text-sm font-bold"></p>
            <button @click="login()" :disabled="loginLoading"
                    class="w-full py-5 bg-orange-500 text-white rounded-2xl font-black uppercase shadow-lg active:scale-95 transition hover:bg-orange-600 disabled:opacity-60">
                <span x-show="!loginLoading">Accéder</span>
                <span x-show="loginLoading">Connexion...</span>
            </button>
        </div>
    </div>
</div>
</template>

<!-- ═══════════ 2. INTERFACE PRINCIPALE ═══════════ -->
<template x-if="isLoggedIn">
<div class="flex h-screen w-full overflow-hidden bg-white xl:max-w-7xl xl:mx-auto xl:my-6 xl:h-[95vh] xl:rounded-3xl border border-gray-100 shadow-2xl">

    <!-- SIDEBAR -->
    <aside class="w-full lg:w-[400px] flex flex-col border-r border-gray-100"
           :class="activeChat ? 'hidden lg:flex' : 'flex'">
        <header class="p-4 bg-white">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-3">
                    <img src="Logo_Wello_Chat_2.png" class="h-9 w-auto" alt="">
                    <h1 class="text-3xl font-extrabold tracking-tighter text-[#004aad]">Wello
                        <span class="text-orange-500" x-text="isAdmin?'DG':'Chat'"></span>
                    </h1>
                </div>
                <div class="flex space-x-2 relative">
                    <button @click="showSearch=!showSearch" class="p-2.5 rounded-full hover:bg-gray-100 text-gray-500">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </button>
                    <button @click="menuOpen=!menuOpen" class="p-2.5 rounded-full hover:bg-gray-100">
                        <svg class="h-6 w-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
                    </button>
                    <div x-show="menuOpen" @click.away="menuOpen=false" x-transition
                         class="absolute right-0 top-12 w-56 bg-white border border-gray-100 rounded-xl shadow-xl p-2 z-20">
                        <template x-if="isAdmin">
                            <button @click="showInviteModal=true;menuOpen=false"
                                    class="w-full text-left p-3 hover:bg-blue-50 rounded-lg text-sm font-bold text-blue-600 border-b border-gray-50 mb-1">
                                + Créer une invitation
                            </button>
                        </template>
                        <button @click="logout()" class="w-full text-left p-3 hover:bg-gray-50 rounded-lg text-sm font-bold text-red-600">Déconnexion</button>
                    </div>
                </div>
            </div>
            <div x-show="showSearch" x-transition class="mb-4">
                <input type="text" x-model="searchQuery" placeholder="Rechercher..."
                       class="w-full p-3 bg-gray-50 rounded-xl text-sm font-bold outline-none border border-gray-100">
            </div>
            <nav class="hidden lg:flex space-x-1 p-1 bg-gray-50 rounded-xl">
                <button @click="tab='chats'" :class="tab==='chats'?'bg-[#004aad] text-white':'text-gray-500'"
                        class="flex-1 py-2 text-center font-bold text-sm rounded-lg transition">Chats</button>
                <button @click="tab='groupes'" :class="tab==='groupes'?'bg-[#004aad] text-white':'text-gray-500'"
                        class="flex-1 py-2 text-center font-bold text-sm rounded-lg transition">Groupes</button>
                <button @click="tab='profil'" :class="tab==='profil'?'bg-[#004aad] text-white':'text-gray-500'"
                        class="flex-1 py-2 text-center font-bold text-sm rounded-lg transition">Profil</button>
            </nav>
        </header>

        <main class="flex-1 overflow-y-auto pb-24">
            <!-- CHATS -->
            <div x-show="tab==='chats'" class="divide-y divide-gray-50">
                <template x-for="user in filteredUsers" :key="user.id">
                    <div @click="activeChat=user" class="px-4 py-4 flex items-center hover:bg-gray-50 cursor-pointer transition">
                        <div class="h-12 w-12 rounded-full bg-[#004aad]/10 flex items-center justify-center text-[#004aad] font-black text-sm"
                             x-text="initiales(user.name)"></div>
                        <div class="ml-4 flex-1 min-w-0">
                            <h3 class="font-bold text-gray-900" x-text="user.name"></h3>
                            <p class="text-xs text-gray-500 truncate" x-text="user.last_message||'Démarrer la discussion'"></p>
                        </div>
                    </div>
                </template>
                <template x-if="filteredUsers.length===0">
                    <div class="p-12 text-center text-gray-300 italic text-sm">Aucun contact</div>
                </template>
            </div>

            <!-- GROUPES -->
            <div x-show="tab==='groupes'" class="divide-y divide-gray-50">
                <template x-if="isAdmin">
                    <div class="p-6">
                        <button @click="showGroupModal=true"
                                class="w-full py-4 bg-orange-100 text-orange-600 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-orange-200 transition">
                            + Créer un nouveau groupe
                        </button>
                    </div>
                </template>
                <template x-for="group in filteredGroups" :key="group.id">
                    <div @click="activeChat=group" class="px-4 py-4 flex items-center hover:bg-gray-50 cursor-pointer transition group-item">
                        <div class="h-12 w-12 rounded-xl bg-orange-500 flex items-center justify-center text-white font-black shadow-sm flex-shrink-0">
                            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        </div>
                        <div class="ml-4 flex-1 min-w-0">
                            <h3 class="font-bold text-gray-900" x-text="group.name"></h3>
                            <p class="text-[10px] text-orange-500 font-bold uppercase tracking-widest"
                               x-text="(group.members||[]).length + ' membre(s)'"></p>
                        </div>
                        <!-- Bouton supprimer (DG seulement) -->
                        <template x-if="isAdmin">
                            <button @click="confirmDeleteGroup(group,$event)"
                                    class="ml-2 p-2 rounded-full text-gray-300 hover:bg-red-50 hover:text-red-500 transition flex-shrink-0"
                                    title="Supprimer le groupe">
                                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </template>
                    </div>
                </template>
                <template x-if="filteredGroups.length===0">
                    <div class="p-12 text-center text-gray-300 italic text-sm">Aucun groupe assigné</div>
                </template>
            </div>

            <!-- PROFIL -->
            <div x-show="tab==='profil'" class="p-8 text-center">
                <div class="h-24 w-24 bg-[#004aad] rounded-full mx-auto mb-6 flex items-center justify-center text-white text-2xl font-black border-4 border-white shadow-md"
                     x-text="isAdmin ? 'DG' : initiales(userProfile.name)"></div>
                <h3 class="font-black text-xl text-gray-950 uppercase" x-text="userProfile.name"></h3>
                <p class="text-[10px] font-black text-orange-500 uppercase mb-6" x-text="userProfile.role"></p>
                <div class="bg-gray-50 rounded-3xl p-5 text-left border border-gray-100">
                    <span class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Numéro de téléphone</span>
                    <span class="font-bold text-gray-700 text-lg" x-text="phoneInput"></span>
                </div>
                <button @click="logout()" class="mt-8 w-full py-4 bg-red-50 text-red-600 rounded-2xl font-black uppercase text-[10px] hover:bg-red-100 transition">
                    Déconnexion
                </button>
            </div>
        </main>

        <!-- NAV MOBILE BAS -->
        <nav class="lg:hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 flex justify-around p-3 pb-8">
            <button @click="tab='chats'" :class="tab==='chats'?'text-[#004aad]':'text-gray-300'" class="flex flex-col items-center">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                <span class="text-[9px] font-bold mt-1 uppercase">Chats</span>
            </button>
            <button @click="tab='groupes'" :class="tab==='groupes'?'text-[#004aad]':'text-gray-300'" class="flex flex-col items-center">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span class="text-[9px] font-bold mt-1 uppercase">Groupes</span>
            </button>
            <button @click="tab='profil'" :class="tab==='profil'?'text-[#004aad]':'text-gray-300'" class="flex flex-col items-center">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span class="text-[9px] font-bold mt-1 uppercase">Profil</span>
            </button>
        </nav>
    </aside>

    <!-- ZONE DISCUSSION -->
    <main class="flex-1 flex flex-col bg-gray-50" :class="activeChat?'flex':'hidden lg:flex'">
        <template x-if="activeChat">
        <div class="flex flex-col h-full bg-white">

            <!-- Header du chat -->
            <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between bg-white shadow-sm min-h-[68px]">
                <div class="flex items-center">
                    <button @click="activeChat=null" class="lg:hidden mr-3 text-gray-400">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <div class="h-10 w-10 rounded-full bg-[#004aad] flex items-center justify-center text-white font-bold text-sm"
                         x-text="initiales(activeChat.name)"></div>
                    <div class="ml-3">
                        <h4 class="font-bold text-gray-950" x-text="activeChat.name"></h4>
                        <p class="text-[10px] text-green-500 font-bold uppercase tracking-widest">Connecté</p>
                    </div>
                </div>
                <!-- Actions header : gérer membres + appels -->
                <div class="flex items-center space-x-2">
                    <!-- Appel audio -->
                    <button @click="startCall('audio')"
                            class="p-2.5 rounded-full hover:bg-gray-100 text-[#004aad] transition" title="Appel audio">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    </button>
                    <!-- Appel vidéo -->
                    <button @click="startCall('video')"
                            class="p-2.5 rounded-full hover:bg-gray-100 text-[#004aad] transition" title="Appel vidéo">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.069A1 1 0 0121 8.868v6.264a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    </button>
                    <!-- Gérer membres groupe (DG) -->
                    <template x-if="isAdmin && activeChat.members !== undefined">
                        <button @click="showManageMembers=true"
                                class="p-2.5 rounded-full hover:bg-gray-100 text-[#004aad] transition" title="Gérer les membres">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Zone messages -->
            <div id="msgs" class="flex-1 bg-gray-50 p-4 overflow-y-auto flex flex-col">
                <template x-if="messages.length===0">
                    <div class="flex-1 flex items-center justify-center">
                        <div class="p-6 bg-white rounded-3xl shadow-sm max-w-xs text-center">
                            <p class="text-gray-400 text-sm italic">Début de la discussion avec
                                <span class="font-bold text-[#004aad]" x-text="activeChat.name"></span>.
                            </p>
                        </div>
                    </div>
                </template>
                <template x-for="msg in messages" :key="msg.id">
                    <div class="mb-3 flex" :class="msg.senderId===phoneInput?'justify-end':'justify-start'">
                        <!-- Nom expéditeur (groupes, messages reçus) -->
                        <div class="max-w-[75%]">
                            <template x-if="msg.senderId!==phoneInput && activeChat.members!==undefined">
                                <p class="text-[9px] font-bold text-[#004aad] mb-1 px-1" x-text="msg.senderName"></p>
                            </template>
                            <div class="px-4 py-3 rounded-2xl shadow-sm text-sm"
                                 :class="msg.senderId===phoneInput?'bg-[#004aad] text-white rounded-br-none':'bg-white text-gray-800 rounded-bl-none'">
                                <!-- TEXT -->
                                <template x-if="msg.type==='text'||!msg.type">
                                    <p x-text="msg.text"></p>
                                </template>
                                <!-- IMAGE -->
                                <template x-if="msg.type==='image'">
                                    <img :src="msg.url" class="max-w-full rounded-xl cursor-pointer" @click="window.open(msg.url,'_blank')" style="max-height:220px;object-fit:cover;">
                                </template>
                                <!-- VIDEO -->
                                <template x-if="msg.type==='video'">
                                    <video :src="msg.url" controls class="max-w-full rounded-xl" style="max-height:220px;"></video>
                                </template>
                                <!-- AUDIO / VOCAL -->
                                <template x-if="msg.type==='audio'||msg.type==='voice'">
                                    <div class="flex items-center space-x-2 min-w-[180px]">
                                        <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                        <audio :src="msg.url" controls class="h-8 w-full" style="min-width:140px;"></audio>
                                    </div>
                                </template>
                                <!-- FICHIER -->
                                <template x-if="msg.type==='file'">
                                    <a :href="msg.url" target="_blank" class="flex items-center space-x-2 hover:opacity-80">
                                        <svg class="h-6 w-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                        <div>
                                            <p class="font-bold text-xs truncate max-w-[160px]" x-text="msg.fileName||'Fichier'"></p>
                                            <p class="text-[9px] opacity-70" x-text="humanSize(msg.fileSize||0)"></p>
                                        </div>
                                    </a>
                                </template>
                                <p class="text-[9px] mt-1 opacity-60 text-right" x-text="formatTime(msg.timestamp)"></p>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Barre upload progress -->
            <div x-show="uploadProgress>0" class="px-4 pb-0">
                <div class="h-1 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-orange-500 transition-all" :style="'width:'+uploadProgress+'%'"></div>
                </div>
            </div>

            <!-- Barre saisie -->
            <div class="p-3 bg-white border-t border-gray-100">
                <!-- Bouton vocal maintenu -->
                <div x-show="isRecording" class="flex items-center justify-center space-x-4 py-2 bg-red-50 rounded-2xl mb-2">
                    <div class="h-3 w-3 bg-red-500 rounded-full animate-pulse"></div>
                    <span class="text-red-600 font-bold text-sm">Enregistrement...</span>
                    <button @click="stopVoice()" class="px-4 py-2 bg-red-500 text-white rounded-xl font-bold text-xs">Envoyer</button>
                </div>
                <div x-show="!isRecording" class="flex items-center space-x-2">
                    <!-- Pièce jointe -->
                    <div class="relative" x-data="{open:false}">
                        <button @click="open=!open" class="p-3 rounded-full hover:bg-gray-100 text-gray-400 transition">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                        </button>
                        <div x-show="open" @click.away="open=false" x-transition
                             class="absolute bottom-14 left-0 bg-white border border-gray-100 rounded-2xl shadow-xl p-2 z-10 w-44">
                            <button @click="triggerFile('image/*');open=false"
                                    class="w-full text-left px-3 py-2.5 hover:bg-gray-50 rounded-xl text-sm font-bold flex items-center space-x-2">
                                <svg class="h-4 w-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                <span>Photo</span>
                            </button>
                            <button @click="triggerFile('video/*');open=false"
                                    class="w-full text-left px-3 py-2.5 hover:bg-gray-50 rounded-xl text-sm font-bold flex items-center space-x-2">
                                <svg class="h-4 w-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.069A1 1 0 0121 8.868v6.264a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                <span>Vidéo</span>
                            </button>
                            <button @click="triggerFile('*/*');open=false"
                                    class="w-full text-left px-3 py-2.5 hover:bg-gray-50 rounded-xl text-sm font-bold flex items-center space-x-2">
                                <svg class="h-4 w-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                <span>Document</span>
                            </button>
                        </div>
                    </div>
                    <!-- Champ texte -->
                    <div class="flex-1 flex items-center bg-gray-50 rounded-2xl px-4 py-2">
                        <input type="text" x-model="newMessage" @keyup.enter="sendMessage()"
                               placeholder="Écrivez un message..."
                               class="flex-1 bg-transparent outline-none font-medium text-sm">
                    </div>
                    <!-- Micro (maintenir pour vocal) -->
                    <button @mousedown="startVoice()" @touchstart.prevent="startVoice()"
                            class="p-3 rounded-full hover:bg-gray-100 text-gray-400 transition" title="Maintenir pour enregistrer">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                    </button>
                    <!-- Envoyer -->
                    <button @click="sendMessage()" class="p-3 bg-[#004aad] text-white rounded-xl shadow hover:bg-blue-700 transition">
                        <svg class="h-5 w-5 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    </button>
                </div>
            </div>
        </div>
        </template>

        <template x-if="!activeChat">
        <div class="h-full flex flex-col items-center justify-center p-12 text-center">
            <img src="Logo_Wello_Chat_2.png" class="h-20 opacity-10 mb-4 grayscale" alt="">
            <h2 class="text-2xl font-black text-gray-200 uppercase tracking-widest">Wello Workspace</h2>
        </div>
        </template>
    </main>
</div>
</template>

<!-- ═══════════ MODALES ═══════════ -->

<!-- Appel sortant -->
<template x-if="callState==='outgoing'||callState==='active'">
<div class="fixed inset-0 z-[200] flex flex-col bg-[#004aad]">
    <!-- Vidéo distante plein écran -->
    <video id="remote-video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"
           x-show="callType==='video'"></video>
    <!-- Vidéo locale petite -->
    <video id="local-video" autoplay playsinline muted
           class="absolute top-4 right-4 w-32 h-44 rounded-2xl object-cover shadow-2xl border-2 border-white/30 z-10"
           x-show="callType==='video'"></video>
    <!-- Overlay info (quand pas encore connecté ou audio) -->
    <div class="relative z-10 flex-1 flex flex-col items-center justify-center text-white p-8"
         :class="callType==='video'&&callState==='active'?'opacity-0 hover:opacity-100 transition':''">
        <div class="h-24 w-24 rounded-full bg-white/20 flex items-center justify-center text-3xl font-black mb-6"
             x-text="callTarget?initiales(callTarget.name):'?'"></div>
        <h2 class="text-2xl font-black mb-2" x-text="callTarget?callTarget.name:''"></h2>
        <p class="text-white/70 font-medium" x-text="callState==='outgoing'?'Appel en cours...':'En communication'"></p>
        <p class="text-sm text-white/50 mt-1" x-text="callType==='video'?'Appel vidéo':'Appel audio'"></p>
    </div>
    <!-- Boutons bas -->
    <div class="relative z-10 flex justify-center space-x-8 pb-16 pt-6">
        <button @click="hangUp()"
                class="h-16 w-16 rounded-full bg-red-500 flex items-center justify-center shadow-2xl active:scale-90 transition">
            <svg class="h-7 w-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"/></svg>
        </button>
    </div>
</div>
</template>

<!-- Appel entrant -->
<template x-if="callState==='incoming'">
<div class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-[#004aad]/95 backdrop-blur-sm">
    <div class="h-28 w-28 rounded-full bg-white/20 flex items-center justify-center text-4xl font-black text-white mb-6 animate-pulse"
         x-text="callTarget?initiales(callTarget.callerName||'?'):'?'"></div>
    <h2 class="text-2xl font-black text-white mb-1" x-text="callTarget?callTarget.callerName:''"></h2>
    <p class="text-white/70 mb-12" x-text="callTarget&&callTarget.type==='video'?'Appel vidéo entrant':'Appel audio entrant'"></p>
    <div class="flex space-x-16">
        <div class="flex flex-col items-center">
            <button @click="rejectCall()"
                    class="h-16 w-16 rounded-full bg-red-500 flex items-center justify-center shadow-2xl active:scale-90 transition mb-2">
                <svg class="h-7 w-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <span class="text-white/60 text-xs font-bold">Refuser</span>
        </div>
        <div class="flex flex-col items-center">
            <button @click="answerCall()"
                    class="h-16 w-16 rounded-full bg-green-500 flex items-center justify-center shadow-2xl active:scale-90 transition mb-2">
                <svg class="h-7 w-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            </button>
            <span class="text-white/60 text-xs font-bold">Répondre</span>
        </div>
    </div>
</div>
</template>

<!-- Modale Nouveau Groupe -->
<template x-if="showGroupModal">
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-white w-full max-w-md rounded-[40px] p-8 shadow-2xl">
        <h3 class="text-2xl font-black text-[#004aad] mb-6 uppercase tracking-tighter text-center">Nouveau Groupe</h3>
        <div class="space-y-4">
            <input type="text" x-model="newGroupName" placeholder="Nom du groupe"
                   class="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none border border-gray-100 text-center uppercase tracking-widest focus:ring-2 focus:ring-orange-500 transition">
            <div class="max-h-48 overflow-y-auto border border-gray-100 rounded-2xl p-2">
                <p class="text-[9px] font-black text-gray-400 uppercase p-2">Sélectionner les membres</p>
                <template x-for="user in usersList" :key="user.id">
                    <label class="flex items-center p-2 hover:bg-gray-50 rounded-xl transition cursor-pointer">
                        <input type="checkbox" :value="user.phone" x-model="selectedMembers" class="h-4 w-4 text-[#004aad] rounded border-gray-300">
                        <span class="ml-3 text-sm font-bold text-gray-700" x-text="user.name"></span>
                    </label>
                </template>
            </div>
            <div class="flex space-x-3 pt-2">
                <button @click="showGroupModal=false" class="flex-1 py-4 bg-gray-100 text-gray-500 rounded-2xl font-black uppercase text-[10px]">Annuler</button>
                <button @click="createGroup()" class="flex-1 py-4 bg-[#004aad] text-white rounded-2xl font-black uppercase text-[10px] shadow-lg">Créer</button>
            </div>
        </div>
    </div>
</div>
</template>

<!-- Modale Confirmation Suppression Groupe -->
<template x-if="showDeleteGroup">
<div class="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-white w-full max-w-sm rounded-[32px] p-8 shadow-2xl text-center">
        <div class="h-16 w-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="h-8 w-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </div>
        <h3 class="text-lg font-black text-gray-900 mb-2">Supprimer le groupe ?</h3>
        <p class="text-sm text-gray-400 mb-6">
            "<span class="font-bold text-gray-600" x-text="groupToDelete?groupToDelete.name:''"></span>"
            sera définitivement supprimé.
        </p>
        <div class="flex space-x-3">
            <button @click="showDeleteGroup=false;groupToDelete=null" class="flex-1 py-4 bg-gray-100 text-gray-500 rounded-2xl font-black uppercase text-[10px]">Annuler</button>
            <button @click="deleteGroup()" class="flex-1 py-4 bg-red-500 text-white rounded-2xl font-black uppercase text-[10px] shadow-lg">Supprimer</button>
        </div>
    </div>
</div>
</template>

<!-- Modale Gérer Membres -->
<template x-if="showManageMembers">
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-white w-full max-w-md rounded-[40px] p-8 shadow-2xl">
        <h3 class="text-xl font-black text-[#004aad] mb-1 uppercase tracking-tighter text-center">Membres</h3>
        <p class="text-center text-[10px] font-bold text-gray-400 uppercase mb-6" x-text="activeChat.name"></p>
        <div class="space-y-4">
            <div class="max-h-60 overflow-y-auto border border-gray-100 rounded-2xl p-2">
                <template x-for="user in usersList" :key="user.id">
                    <label class="flex items-center p-2 hover:bg-gray-50 rounded-xl transition cursor-pointer">
                        <input type="checkbox" :value="user.phone" x-model="activeChat.members" class="h-4 w-4 text-[#004aad] rounded border-gray-300">
                        <div class="ml-3">
                            <span class="text-sm font-bold text-gray-700" x-text="user.name"></span>
                            <span class="text-[9px] text-gray-400 block" x-text="user.phone"></span>
                        </div>
                    </label>
                </template>
            </div>
            <div class="flex space-x-3 pt-2">
                <button @click="showManageMembers=false" class="flex-1 py-4 bg-gray-100 text-gray-500 rounded-2xl font-black uppercase text-[10px]">Fermer</button>
                <button @click="updateGroupMembers()" class="flex-1 py-4 bg-orange-500 text-white rounded-2xl font-black uppercase text-[10px] shadow-lg">Enregistrer</button>
            </div>
        </div>
    </div>
</div>
</template>

<!-- Modale Invitation -->
<template x-if="showInviteModal">
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-white w-full max-w-md rounded-[40px] p-8 shadow-2xl max-h-[92vh] overflow-y-auto">
        <!-- ÉTAPE 1 -->
        <div x-show="inviteStep===1">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-black text-[#004aad] uppercase tracking-tighter">Nouvel Accès</h3>
                <button @click="resetInviteModal()" class="text-gray-300 hover:text-gray-500 text-2xl leading-none">&times;</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase block mb-1">Prénom</label>
                    <input type="text" x-model="invitePrenom" placeholder="Ex: Justin"
                           class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-[#004aad] transition">
                </div>
                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase block mb-1">Nom</label>
                    <input type="text" x-model="inviteNom" placeholder="Ex: TSOGBE"
                           class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-[#004aad] transition">
                </div>
                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase block mb-1">Numéro de téléphone</label>
                    <input type="tel" x-model="invitePhone" placeholder="Ex: 99000000"
                           class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-[#004aad] transition">
                </div>
                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase block mb-1">Type de profil</label>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="r in ['client','partenaire','personnel','collaborateur']" :key="r">
                            <button @click="inviteRole=r"
                                    :class="inviteRole===r?'bg-[#004aad] text-white border-[#004aad]':'bg-gray-50 text-gray-500 border-gray-100'"
                                    class="py-3 rounded-xl font-black text-[10px] uppercase border-2 transition capitalize"
                                    x-text="r"></button>
                        </template>
                    </div>
                </div>
                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase block mb-1">Groupe <span class="text-gray-300">(optionnel)</span></label>
                    <select x-model="inviteGroupId" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl font-bold text-gray-700 outline-none">
                        <option value="">— Aucun groupe —</option>
                        <template x-for="g in groupsList" :key="g.id">
                            <option :value="g.id" x-text="g.name"></option>
                        </template>
                    </select>
                </div>
                <button @click="generateLink()" :disabled="inviteLoading"
                        class="w-full py-4 bg-orange-500 text-white rounded-2xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition hover:bg-orange-600 disabled:opacity-60 mt-2">
                    <span x-show="!inviteLoading">Créer le compte &amp; Générer le lien</span>
                    <span x-show="inviteLoading">Création en cours...</span>
                </button>
            </div>
        </div>
        <!-- ÉTAPE 2 -->
        <div x-show="inviteStep===2" class="text-center">
            <div class="h-16 w-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="h-8 w-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h3 class="text-xl font-black text-gray-900 mb-1">Compte créé !</h3>
            <p class="text-sm text-gray-400 mb-1">
                <span class="font-bold text-[#004aad]" x-text="invitePrenom+' '+inviteNom"></span>
                · <span class="text-orange-500 font-bold" x-text="inviteRole"></span>
            </p>
            <template x-if="inviteGroupId">
                <p class="text-[10px] text-gray-400 mb-4">Groupe : <span class="font-bold text-gray-600" x-text="(groupsList.find(g=>g.id===inviteGroupId)||{}).name||''"></span></p>
            </template>
            <div class="bg-orange-50 rounded-2xl p-4 border border-orange-100 mb-4">
                <p class="text-[9px] font-black text-orange-600 uppercase mb-2">Lien à envoyer :</p>
                <input id="gen-link" type="text" readonly :value="generatedLink"
                       class="bg-white p-3 rounded-xl text-[10px] font-mono font-bold w-full text-center border border-orange-100 outline-none">
            </div>
            <button @click="copyLink()" class="w-full py-4 bg-[#004aad] text-white rounded-2xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition hover:opacity-90 mb-3">Copier le lien</button>
            <button @click="resetInviteModal()" class="w-full py-3 text-gray-400 text-[10px] font-black uppercase tracking-widest">Créer un autre accès</button>
        </div>
    </div>
</div>
</template>

</body>
</html>
